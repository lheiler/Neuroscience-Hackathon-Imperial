<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Countdown + Continuous Arrow Stimulus</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #000;
      overflow: hidden;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }

    /* Arrow cue */
    #cue {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      color: white;
      font-size: 220px;   /* make it big */
      font-weight: 800;
      line-height: 1;
      user-select: none;
      display: none;
      /* optional: crisper on some screens */
      text-rendering: geometricPrecision;
    }

    /* Countdown text */
    #countdown {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      color: white;
      font-size: 96px;
      font-weight: 700;
      user-select: none;
    }
  </style>
</head>
<body>

  <div id="countdown">5</div>
  <div id="cue">↑</div>

  <script>
    const countdownEl = document.getElementById("countdown");
    const cueEl = document.getElementById("cue");

    const dotIntervalMs = 2500; // time between cue onsets
    const dotOnMs = 150;        // how long cue stays visible
    const leadMs = 10;          // END trigger sent 10ms before next onset

    let count = 5;

    // Directions (random each onset)
    const directions = [
      { name: "up",    symbol: "↑", triggerValue: 1 },
      { name: "down",  symbol: "↓", triggerValue: 2 },
      { name: "left",  symbol: "←", triggerValue: 3 },
      { name: "right", symbol: "→", triggerValue: 4 },
    ];

    function randomDirection() {
      return directions[Math.floor(Math.random() * directions.length)];
    }

    async function sendTrigger(value, meta = {}) {
      try {
        await fetch("http://127.0.0.1:8765/trigger", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ value, ...meta }),
        });
      } catch (e) {
        console.error("Trigger send failed:", e);
      }
    }

    function runCountdown() {
      countdownEl.textContent = count;

      if (count > 1) {
        count--;
        setTimeout(runCountdown, 1000);
      } else {
        setTimeout(() => {
          countdownEl.style.display = "none";
          startCueLoop();
        }, 1000);
      }
    }

    function startCueLoop() {
      // Drift-corrected scheduling using absolute time
      const startTime = performance.now();
      let cycle = 0;

      function scheduleCycle() {
        const targetOnset = startTime + cycle * dotIntervalMs;
        const now = performance.now();
        const delayToOnset = Math.max(0, targetOnset - now);

        setTimeout(() => {
          // Pick a random arrow each onset
          const dir = randomDirection();

          // === CUE ONSET ===
          cueEl.textContent = dir.symbol;
          cueEl.style.display = "block";
          sendTrigger(dir.triggerValue); // START (encode direction with trigger magnitude)

          // Hide cue after dotOnMs (visual only)
          setTimeout(() => {
            cueEl.style.display = "none";
          }, dotOnMs);

          // === END just before the next onset ===
          setTimeout(() => {
            sendTrigger(0); // END (always 0)
          }, Math.max(0, dotIntervalMs - leadMs));

          cycle++;
          scheduleCycle();
        }, delayToOnset);
      }

      scheduleCycle();
    }

    runCountdown();
  </script>

</body>
</html>
